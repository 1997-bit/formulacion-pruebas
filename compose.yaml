# Toma DB_NAME, DB_USER y DB_PASS de .env.
name: formulacion-pruebas

services:
  app:
    build: .
    ports:
      - "8080:80"
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
    volumes:
      - evidencias:/var/www/html/storage/evidencias
      - logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost/"]
      interval: 30s
    restart: unless-stopped

  db:
    image: docker.io/library/mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db:/var/lib/mysql
      # Solo la primera vez, con el volumen vacío.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql:ro
      - ./database/permisos.sh:/docker-entrypoint-initdb.d/3-permisos.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20
    restart: unless-stopped

volumes:
  db:
  evidencias:
  logs:
